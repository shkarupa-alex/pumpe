name: Test

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-git-versioning derives the package version from tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests, lint and type checks
        run: uv run --frozen pytest -q -W error
