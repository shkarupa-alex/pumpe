[build-system]
requires = [
    "setuptools>=84.0.0",
    "setuptools-git-versioning>=3.1.0",
    "wheel>=0.48.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.package-data]
pumpe = ["py.typed"]

[project]
name = "pumpe"
dynamic = ["version"]
description = "Pumping base classes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioitertools>=0.13.0",
    "anyio>=4.15.1",
    "fast-depends>=2.4.12",
    "fastapi[standard]>=0.141.1",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.46",
    "tenacity>=9.1.4",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff==0.16.8",
    "setuptools>=84.0.0",
    "setuptools-git-versioning>=3.1.0",
    "sqlalchemy[aiosqlite]>=2.0.54",
    "types-pyyaml>=6.0.12.20260906",
    "wheel>=0.48.0",
]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["EM", "TRY003", "D1", "FA", "CPY001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
no-lines-before = ["standard-library"]
known-third-party = []

[tool.ruff.lint.extend-per-file-ignores]
"*_test.py" = ["S101", "S311", "PLR2004"]


[tool.mypy]
strict = true


[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
